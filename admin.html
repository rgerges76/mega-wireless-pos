<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Mega Wireless POS Admin</title>
<style>
:root{--navy:#07172d;--navy2:#0d2748;--blue:#087dff;--gold:#ffd84a;--bg:#f4f8fc;--ink:#102033;--muted:#64748b;--line:#dce6ef;--danger:#b42318;--ok:#087d3f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#0b315a);padding:20px}.login-card{width:min(430px,94vw);background:#fff;border:5px solid var(--gold);border-radius:24px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.4)}.login-card h1{margin:0 0 8px;text-align:center}.login-card p{text-align:center;color:var(--muted)}.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:5px 0;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.gold{background:var(--gold);color:#07172d}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.danger{background:#fff1f0;color:var(--danger);border:1px solid #ffd0cc}.status{min-height:22px;margin-top:12px;font-weight:700;font-size:14px;color:var(--danger)}.top{min-height:72px;background:linear-gradient(105deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px}.brand{font-weight:900;letter-spacing:.05em}.brand small{display:block;color:#9bcff6;font-size:10px;margin-top:3px}.toplinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toplinks a{color:#fff;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #31557b;padding:8px 10px;border-radius:9px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}.side{background:#0b1e35;padding:18px}.side button{display:block;width:100%;text-align:left;background:transparent;color:#d7e8f7;border:0;border-radius:11px;padding:12px;margin:5px 0;font-weight:800;cursor:pointer}.side button.on,.side button:hover{background:#173c65}.main{padding:22px;overflow:auto}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(16,32,51,.06)}.kpi b{display:block;font-size:27px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px;border-bottom:1px solid #e9eff5;text-align:left;font-size:13px;white-space:nowrap}.table th{background:#f7fafc;color:#5f6f80;position:sticky;top:0}.table input{min-width:74px;padding:6px;border:1px solid #dfe7ef;border-radius:7px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar .inp{max-width:330px;margin:0}.muted{color:var(--muted)}.ok{color:var(--ok)}.dangerText{color:var(--danger)}.notice{padding:10px 12px;border-radius:10px;background:#eef7ff;color:#174b76;font-size:13px;margin:0 0 14px}.stack{display:grid;gap:10px}.small{font-size:12px}.right{text-align:right}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{min-width:135px}.kpis,.grid{grid-template-columns:1fr}.top{align-items:flex-start}.main{padding:14px}}
</style>
</head>
<body>
<section id="login" class="login"><div class="login-card"><h1>MEGA WIRELESS ADMIN</h1><p>Secure POS Admin Login</p><input id="email" class="inp" type="email" placeholder="Email" autocomplete="email"><input id="password" class="inp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">Sign In</button><div id="loginStatus" class="status">Ready</div></div></section>
<section id="app" class="hidden"><header class="top"><div class="brand">MEGA WIRELESS<small>POS ADMIN CONTROL CENTER</small></div><div class="toplinks"><a href="pos.html">POS</a><a href="repair.html">Repairs</a><span id="who" class="small"></span><button class="btn ghost" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="side"><button data-tab="dashboard" class="on" onclick="route('dashboard')">Dashboard</button><button data-tab="inventory" onclick="route('inventory')">Inventory</button><button data-tab="deals" onclick="route('deals')">Website Deals</button><button data-tab="repairs" onclick="route('repairs')">Repairs</button><button data-tab="reports" onclick="route('reports')">Reports</button><button data-tab="backup" onclick="route('backup')">Backup / Restore</button></aside><main id="main" class="main"></main></div></section>
<script>
const DBKEY='mw_platform_v1',LEGACY={inv:'mw_inv',sales:'mw_sales',repairs:'mw_repairs',cust:'mw_cust',cfg:'mw_cfg'};
function el(id){return document.getElementById(id)}function money(n){return '$'+Number(n||0).toFixed(2)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function readJSON(k,d){try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}}function writeJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}function norm(v){return String(v||'').trim().toLowerCase()}function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function normalizeDB(db){db=db&&typeof db==='object'?db:{};db.settings=db.settings&&typeof db.settings==='object'?db.settings:{};db.settings.storeName=db.settings.storeName||'Mega Wireless Nashville';db.settings.taxRate=Number(db.settings.taxRate||9.75);db.settings.lowStock=Number(db.settings.lowStock||5);['products','websiteDeals','plans','rewards','rewardTiers','sales','repairs'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});db.products=db.products.map((p,i)=>({id:p.id||p.sku||('P'+i),sku:p.sku||p.id||('P'+i),name:String(p.name||'Unnamed Product'),category:String(p.category||'Accessories'),brand:String(p.brand||''),barcode:String(p.barcode||p.bc||''),imei:String(p.imei||''),imeis:Array.isArray(p.imeis)?p.imeis:[],cost:Number(p.cost||0),price:Number(p.price??p.sell??0),qty:Number(p.qty||0),minQty:Number(p.minQty??db.settings.lowStock),showOnline:!!p.showOnline}));return db}
function mergeLegacy(db){let changed=0;const inv=readJSON(LEGACY.inv,{});if(inv&&typeof inv==='object'&&!Array.isArray(inv)){const exact=new Map(),byName=new Map();db.products.forEach(p=>{exact.set(norm(p.category)+'::'+norm(p.name),p);if(!byName.has(norm(p.name)))byName.set(norm(p.name),p)});Object.entries(inv).forEach(([key,d])=>{if(!d||typeof d!=='object')return;const x=key.indexOf('::'),cat=x>=0?key.slice(0,x):'Accessories',name=x>=0?key.slice(x+2):key;if(!name||norm(cat)==='repair')return;let p=exact.get(norm(cat)+'::'+norm(name))||byName.get(norm(name));if(!p){p={id:uid('LEG-'),sku:String(d.sku||''),name,category:cat,brand:'',barcode:String(d.bc||''),imei:'',imeis:Array.isArray(d.imeis)?d.imeis:[],cost:Number(d.cost||0),price:Number(d.sell||0),qty:Number(d.qty||0),minQty:Number(db.settings.lowStock||5),showOnline:false};db.products.push(p);changed++;return}const vals={cost:Number(d.cost||0),price:Number(d.sell||0),qty:Number(d.qty||0)};if(vals.cost&&p.cost!==vals.cost){p.cost=vals.cost;changed++}if(vals.price&&p.price!==vals.price){p.price=vals.price;changed++}if((vals.qty||p.qty===0)&&p.qty!==vals.qty){p.qty=vals.qty;changed++}if(d.bc&&!p.barcode){p.barcode=String(d.bc);changed++}if(Array.isArray(d.imeis)&&d.imeis.length){p.imeis=d.imeis.slice();p.qty=d.imeis.length;changed++}})}const ls=readJSON(LEGACY.sales,[]);if(Array.isArray(ls)){const known=new Set(db.sales.map(s=>String(s.legacyId||s.bridgeId||s.id)));ls.forEach(s=>{const key=String(s.bridgeId||s.id||s.inv||s.time||'');if(!key||known.has(key)||known.has('LEGACY:'+key))return;db.sales.push({id:'LEGACY:'+key,legacyId:key,invoice:s.inv||'',date:s.time||s.date||new Date().toISOString(),cashier:s.cashier||'',items:(s.items||[]).map(x=>({name:x.n||x.name||'',category:x.c||x.category||'',qty:Number(x.qty||1),price:Number(x.price||0),imei:x.imei||''})),subtotal:Number(s.sub||s.subtotal||0),discount:Number(s.disc||0),tax:Number(s.tax||0),total:Number(s.grand??s.total??0),cost:Number(s.cogs??s.cost??0),payment:s.pay||s.payment||'',voided:!!s.voided});known.add(key);changed++})}const lr=readJSON(LEGACY.repairs,[]);if(Array.isArray(lr)){const map=new Map(db.repairs.map(r=>[String(r.id),r]));lr.forEach(r=>{if(!r||!r.id)return;const cur=map.get(String(r.id));if(!cur){db.repairs.push({...r});map.set(String(r.id),db.repairs[db.repairs.length-1]);changed++;return}const a=Date.parse(cur.updatedAt||cur.createdAt||0)||0,b=Date.parse(r.updatedAt||r.createdAt||0)||0;if(b>a){Object.assign(cur,r);changed++}})}return changed}
function syncLegacy(db){const out=readJSON(LEGACY.inv,{});const inv=out&&typeof out==='object'&&!Array.isArray(out)?out:{};const cats=readJSON(LEGACY.cust,{});const cust=cats&&typeof cats==='object'&&!Array.isArray(cats)?cats:{};db.products.forEach(p=>{if(!p.name||norm(p.category)==='repair')return;const key=(p.category||'Accessories')+'::'+p.name,prev=inv[key]||{};inv[key]={...prev,sku:p.sku||prev.sku||'',bc:p.barcode||prev.bc||'',cost:Number(p.cost||0),sell:Number(p.price||0),qty:Number(p.qty||0),imeis:Array.isArray(p.imeis)?p.imeis:[]};if(!Array.isArray(cust[p.category]))cust[p.category]=[];if(!cust[p.category].includes(p.name))cust[p.category].push(p.name)});writeJSON(LEGACY.inv,inv);writeJSON(LEGACY.cust,cust);writeJSON(LEGACY.repairs,db.repairs||[]);const cfg=readJSON(LEGACY.cfg,{});writeJSON(LEGACY.cfg,{...(cfg||{}),tax:Number(db.settings.taxRate||9.75)})}
function saveDB(){window.db=normalizeDB(window.db);writeJSON(DBKEY,window.db);syncLegacy(window.db)}
async function loadDB(){let db=readJSON(DBKEY,null);if(!db){const r=await fetch('/data/seed.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Could not load POS data ('+r.status+')');db=await r.json()}db=normalizeDB(db);window.migrationCount=mergeLegacy(db);window.db=db;saveDB();return db}
async function login(){const s=el('loginStatus'),email=el('email').value.trim(),password=el('password').value;if(!email||!password){s.textContent='Enter email and password';return}s.textContent='Signing in...';try{const body=new URLSearchParams({grant_type:'password',username:email,password});const r=await fetch('/.netlify/identity/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString(),cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error_description||data.msg||data.error||('Login failed ('+r.status+')'));sessionStorage.setItem('mw_identity_token',data.access_token||'');sessionStorage.setItem('mw_identity_email',email);await startAdmin()}catch(e){s.textContent=e.message||'Login failed'}}
async function startAdmin(){try{el('login').classList.add('hidden');el('app').classList.remove('hidden');el('who').textContent=sessionStorage.getItem('mw_identity_email')||'';await loadDB();route('dashboard')}catch(e){el('app').classList.add('hidden');el('login').classList.remove('hidden');el('loginStatus').textContent=e.message||'Admin failed to load'}}function logout(){sessionStorage.clear();location.reload()}
function route(tab){document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));({dashboard:renderDashboard,inventory:renderInventory,deals:renderDeals,repairs:renderRepairs,reports:renderReports,backup:renderBackup}[tab]||renderDashboard)()}
function renderDashboard(){const db=window.db,today=new Date().toISOString().slice(0,10),sales=(db.sales||[]).filter(s=>!s.voided),ts=sales.filter(s=>(s.date||'').slice(0,10)===today),rev=ts.reduce((a,s)=>a+Number(s.total||0),0),low=db.products.filter(p=>Number(p.qty||0)<=Number(p.minQty??db.settings.lowStock)).length,due=(db.repairs||[]).reduce((a,r)=>a+Math.max(0,Number(r.total||0)-Number(r.deposit||0)),0);el('main').innerHTML=`${window.migrationCount?`<div class="notice"><b>Data synchronized:</b> ${window.migrationCount} legacy POS values were merged into the unified database.</div>`:''}<div class="kpis"><div class="card kpi">Today Sales<b>${money(rev)}</b></div><div class="card kpi">Products<b>${db.products.length}</b></div><div class="card kpi">Low Stock<b>${low}</b></div><div class="card kpi">Repair Due<b>${money(due)}</b></div></div><div class="card"><h2>System Status</h2><p class="ok"><b>Admin, POS inventory and repairs are using the same browser data store.</b></p><p>Sales records: <b>${sales.length}</b> · Repairs: <b>${db.repairs.length}</b> · Website deals: <b>${db.websiteDeals.length}</b></p></div>`}
function renderInventory(){el('main').innerHTML=`<div class="card"><h2>Inventory</h2><p class="muted small">Cost / Price / Qty values are synchronized with the legacy POS inventory on this computer.</p><div class="grid"><input id="pname" class="inp" placeholder="Product name"><input id="pcat" class="inp" placeholder="Category" value="Accessories"><input id="pcost" class="inp" type="number" step="0.01" placeholder="Cost"><input id="pprice" class="inp" type="number" step="0.01" placeholder="Price"><input id="pqty" class="inp" type="number" placeholder="Qty"><input id="pmin" class="inp" type="number" placeholder="Low stock" value="5"><input id="pbar" class="inp" placeholder="Barcode / IMEI"><button class="btn primary" onclick="addProduct()">Add Product</button></div><br><div class="toolbar"><input id="search" class="inp" placeholder="Search name / category / SKU / barcode..." oninput="drawProducts()"><button class="btn ghost" onclick="forceSync()">Sync POS Data</button></div><div id="ptable" class="table-wrap" style="max-height:65vh"></div></div>`;drawProducts()}
function drawProducts(){const q=norm(el('search')?.value),rows=window.db.products.filter(p=>!q||[p.name,p.category,p.sku,p.barcode,p.imei].some(v=>norm(v).includes(q)));el('ptable').innerHTML=`<table class="table"><tr><th>Name</th><th>Category</th><th>Cost</th><th>Price</th><th>Qty</th><th>Low</th><th>Barcode</th><th>Online</th><th></th></tr>${rows.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td><input type="number" step="0.01" value="${Number(p.cost||0)}" onchange="editProduct('${p.id}','cost',this.value)"></td><td><input type="number" step="0.01" value="${Number(p.price||0)}" onchange="editProduct('${p.id}','price',this.value)"></td><td><input type="number" value="${Number(p.qty||0)}" onchange="editProduct('${p.id}','qty',this.value)"></td><td><input type="number" value="${Number(p.minQty||5)}" onchange="editProduct('${p.id}','minQty',this.value)"></td><td><input value="${esc(p.barcode||'')}" onchange="editProduct('${p.id}','barcode',this.value)"></td><td><input type="checkbox" ${p.showOnline?'checked':''} onchange="editProduct('${p.id}','showOnline',this.checked)"></td><td><button class="btn danger" onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`).join('')}</table>`}
function addProduct(){const id=uid('MW-');window.db.products.unshift({id,sku:id,name:el('pname').value.trim()||'New Product',category:el('pcat').value.trim()||'Accessories',brand:'',barcode:el('pbar').value.trim(),imei:'',imeis:[],cost:Number(el('pcost').value||0),price:Number(el('pprice').value||0),qty:Number(el('pqty').value||0),minQty:Number(el('pmin').value||5),showOnline:false});saveDB();renderInventory()}function editProduct(id,k,v){const p=window.db.products.find(x=>String(x.id)===String(id));if(!p)return;p[k]=k==='showOnline'?!!v:(['cost','price','qty','minQty'].includes(k)?Number(v||0):String(v||''));saveDB()}function deleteProduct(id){const p=window.db.products.find(x=>String(x.id)===String(id));if(!p||!confirm('Delete '+p.name+'?'))return;window.db.products=window.db.products.filter(x=>String(x.id)!==String(id));saveDB();drawProducts()}function forceSync(){window.migrationCount=mergeLegacy(window.db);saveDB();drawProducts();alert('POS data synchronized. Updated values: '+window.migrationCount)}
function renderDeals(){el('main').innerHTML=`<div class="card"><h2>Website Deals</h2><div class="grid"><input id="dname" class="inp" placeholder="Device"><input id="dspec" class="inp" placeholder="Specs"><input id="dprice" class="inp" type="number" step="0.01" placeholder="Price"><input id="dbadge" class="inp" placeholder="Badge"><button class="btn primary" onclick="addDeal()">Add Deal</button></div><br><div class="table-wrap"><table class="table"><tr><th>Device</th><th>Specs</th><th>Price</th><th>Badge</th><th>Online</th><th></th></tr>${window.db.websiteDeals.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.spec||'')}</td><td>${money(d.price)}</td><td>${esc(d.badge||'')}</td><td>${d.showOnline!==false?'Yes':'No'}</td><td><button class="btn danger" onclick="deleteDeal('${d.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`}function addDeal(){window.db.websiteDeals.unshift({id:uid('D'),name:el('dname').value.trim()||'New Deal',spec:el('dspec').value.trim(),price:Number(el('dprice').value||0),badge:el('dbadge').value.trim()||'Deal',showOnline:true});saveDB();renderDeals()}function deleteDeal(id){window.db.websiteDeals=window.db.websiteDeals.filter(d=>String(d.id)!==String(id));saveDB();renderDeals()}
function renderRepairs(){const rows=[...(window.db.repairs||[])].sort((a,b)=>Date.parse(b.updatedAt||b.createdAt||0)-Date.parse(a.updatedAt||a.createdAt||0));el('main').innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin:0">Repairs</h2><button class="btn primary" onclick="location.href='repair.html'">Open Repair Desk</button></div><div class="table-wrap"><table class="table"><tr><th>ID</th><th>Customer</th><th>Device</th><th>Status</th><th>Total</th><th>Due</th></tr>${rows.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.customer||'')}</td><td>${esc(r.device||'')}</td><td>${esc(r.status||'')}</td><td>${money(r.total)}</td><td>${money(Math.max(0,Number(r.total||0)-Number(r.deposit||0)))}</td></tr>`).join('')}</table></div></div>`}
function renderReports(){const sales=(window.db.sales||[]).filter(s=>!s.voided),rev=sales.reduce((a,s)=>a+Number(s.total||0),0),cost=sales.reduce((a,s)=>a+Number(s.cost||0),0),inv=window.db.products.reduce((a,p)=>a+Number(p.cost||0)*Number(p.qty||0),0),retail=window.db.products.reduce((a,p)=>a+Number(p.price||0)*Number(p.qty||0),0);el('main').innerHTML=`<div class="kpis"><div class="card kpi">Total Sales<b>${money(rev)}</b></div><div class="card kpi">Gross Profit<b>${money(rev-cost)}</b></div><div class="card kpi">Inventory Cost<b>${money(inv)}</b></div><div class="card kpi">Inventory Retail<b>${money(retail)}</b></div></div><div class="card"><h2>Transactions</h2><p><b>${sales.length}</b> completed/non-void sales records.</p></div>`}
function renderBackup(){el('main').innerHTML=`<div class="card stack"><h2>Backup / Restore</h2><p class="muted">Backup includes inventory, sales, repairs, settings, deals and plans currently stored on this browser.</p><div class="toolbar"><button class="btn primary" onclick="downloadBackup()">Download Backup JSON</button><button class="btn ghost" onclick="copyBackup()">Copy JSON</button></div><textarea id="restore" class="inp" style="height:220px" placeholder="Paste backup JSON here"></textarea><div class="toolbar"><button class="btn gold" onclick="restoreBackup()">Restore Backup</button><button class="btn danger" onclick="reloadSeed()">Reset to Seed Data</button></div></div>`}function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(window.db,null,2)],{type:'application/json'}));a.download='mega-wireless-pos-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}async function copyBackup(){await navigator.clipboard.writeText(JSON.stringify(window.db,null,2));alert('Backup copied')}function restoreBackup(){try{const x=normalizeDB(JSON.parse(el('restore').value));window.db=x;mergeLegacy(window.db);saveDB();alert('Backup restored');route('dashboard')}catch(e){alert('Invalid backup JSON')}}async function reloadSeed(){if(!confirm('Reset local POS database to seed data? Make a backup first.'))return;localStorage.removeItem(DBKEY);const r=await fetch('/data/seed.json?ts='+Date.now(),{cache:'no-store'});window.db=normalizeDB(await r.json());mergeLegacy(window.db);saveDB();route('dashboard')}
if(sessionStorage.getItem('mw_identity_token'))startAdmin();
</script></body></html>
