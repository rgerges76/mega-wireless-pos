<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Mega Wireless POS Admin</title>
<style>
:root{--navy:#07172d;--navy2:#0d2748;--blue:#087dff;--gold:#ffd84a;--bg:#f4f8fc;--ink:#102033;--muted:#64748b;--line:#dce6ef;--danger:#b42318;--ok:#087d3f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#0b315a);padding:20px}.login-card{width:min(430px,94vw);background:#fff;border:5px solid var(--gold);border-radius:24px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.4)}.login-card h1{margin:0 0 8px;text-align:center}.login-card p{text-align:center;color:var(--muted)}.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:5px 0;background:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.gold{background:var(--gold);color:#07172d}.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.danger{background:#fff1f0;color:var(--danger);border:1px solid #ffd0cc}.status{min-height:22px;margin-top:12px;font-weight:700;font-size:14px;color:var(--danger)}.top{min-height:72px;background:linear-gradient(105deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:12px}.brand{font-weight:900;letter-spacing:.05em}.brand small{display:block;color:#9bcff6;font-size:10px;margin-top:3px}.toplinks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toplinks a{color:#fff;text-decoration:none;font-size:12px;font-weight:800;border:1px solid #31557b;padding:8px 10px;border-radius:9px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}.side{background:#0b1e35;padding:18px}.side button{display:block;width:100%;text-align:left;background:transparent;color:#d7e8f7;border:0;border-radius:11px;padding:12px;margin:5px 0;font-weight:800;cursor:pointer}.side button.on,.side button:hover{background:#173c65}.main{padding:22px;overflow:auto}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(16,32,51,.06)}.kpi b{display:block;font-size:27px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.table-wrap{overflow:auto;max-height:68vh}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px;border-bottom:1px solid #e9eff5;text-align:left;font-size:13px;white-space:nowrap}.table th{background:#f7fafc;color:#5f6f80;position:sticky;top:0;z-index:1}.table input,.table select{min-width:72px;padding:6px;border:1px solid #dfe7ef;border-radius:7px;background:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar .inp{max-width:360px;margin:0}.muted{color:var(--muted)}.ok{color:var(--ok)}.dangerText{color:var(--danger)}.notice{padding:10px 12px;border-radius:10px;background:#eef7ff;color:#174b76;font-size:13px;margin:0 0 14px}.warn{padding:10px 12px;border-radius:10px;background:#fff8e1;color:#765400;font-size:13px;margin:0 0 14px}.stack{display:grid;gap:10px}.small{font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef7ff;color:#174b76;font-size:11px;font-weight:800}.badgered{background:#fff1f0;color:var(--danger)}.badgegreen{background:#eaf8f0;color:var(--ok)}h2{margin-top:0}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto}.side button{min-width:135px}.kpis,.grid,.grid2{grid-template-columns:1fr}.top{align-items:flex-start}.main{padding:14px}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <h1>MEGA WIRELESS ADMIN</h1>
    <p>Secure POS Admin Login</p>
    <input id="email" class="inp" type="email" placeholder="Email" autocomplete="email">
    <input id="password" class="inp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">Sign In</button>
    <div id="loginStatus" class="status">Ready</div>
  </div>
</section>

<section id="app" class="hidden">
  <header class="top">
    <div class="brand">MEGA WIRELESS<small>POS ADMIN CONTROL CENTER</small></div>
    <div class="toplinks"><a href="index.html">Main POS</a><a href="repair.html">Repairs</a><span id="who" class="small"></span><button class="btn ghost" onclick="logout()">Logout</button></div>
  </header>
  <div class="layout">
    <aside class="side">
      <button data-tab="dashboard" class="on" onclick="route('dashboard')">Dashboard</button>
      <button data-tab="inventory" onclick="route('inventory')">Inventory</button>
      <button data-tab="repairs" onclick="route('repairs')">Repairs</button>
      <button data-tab="deals" onclick="route('deals')">Website Deals</button>
      <button data-tab="plans" onclick="route('plans')">Activation Plans</button>
      <button data-tab="reports" onclick="route('reports')">Reports</button>
      <button data-tab="settings" onclick="route('settings')">Settings</button>
      <button data-tab="backup" onclick="route('backup')">Backup / Restore</button>
    </aside>
    <main id="main" class="main"></main>
  </div>
</section>

<script src="assets/js/app.js"></script>
<script>
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function num(v){return Number(v||0)}
function fmtDate(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString()}

async function login(){
  const s=el('loginStatus'),email=el('email').value.trim(),password=el('password').value;
  if(!email||!password){s.textContent='Enter email and password';return}
  s.textContent='Signing in...';
  try{
    const body=new URLSearchParams({grant_type:'password',username:email,password});
    const r=await fetch('/.netlify/identity/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString(),cache:'no-store'});
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error_description||data.msg||data.error||('Login failed ('+r.status+')'));
    sessionStorage.setItem('mw_identity_token',data.access_token||'');sessionStorage.setItem('mw_identity_email',email);await startAdmin();
  }catch(e){s.textContent=e.message||'Login failed'}
}
async function startAdmin(){
  try{el('login').classList.add('hidden');el('app').classList.remove('hidden');el('who').textContent=sessionStorage.getItem('mw_identity_email')||'';window.db=await loadSeed();route('dashboard')}
  catch(e){el('app').classList.add('hidden');el('login').classList.remove('hidden');el('loginStatus').textContent=e.message||'Admin failed to load'}
}
function logout(){sessionStorage.removeItem('mw_identity_token');sessionStorage.removeItem('mw_identity_email');location.reload()}
function persist(){saveDB(window.db)}
function route(tab){document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));const fn={dashboard:renderDashboard,inventory:renderInventory,repairs:renderRepairs,deals:renderDeals,plans:renderPlans,reports:renderReports,settings:renderSettings,backup:renderBackup}[tab]||renderDashboard;fn()}

function activeProducts(){return window.db.products.filter(p=>num(p.price)>0||num(p.qty)>0||num(p.cost)>0)}
function renderDashboard(){
  MWData.mergeLegacy(window.db);persist();
  const sales=(window.db.sales||[]).filter(s=>!s.voided),today=new Date().toISOString().slice(0,10),todaySales=sales.filter(s=>(s.date||'').slice(0,10)===today),rev=todaySales.reduce((a,s)=>a+num(s.total),0),active=activeProducts(),low=active.filter(p=>num(p.qty)<=num(p.minQty??window.db.settings.lowStock)).length,openRepairs=(window.db.repairs||[]).filter(r=>!['Completed','Paid'].includes(r.status)).length;
  const legacyInv=MWData.readJSON('mw_inv',{}),legacySales=MWData.readJSON('mw_sales',[]);
  el('main').innerHTML=`<div class="notice"><b>Unified data sync is active.</b> Admin reads and writes the same legacy inventory and sales data used by the Main POS on this browser.</div><div class="kpis"><div class="card kpi">Today Sales<b>${money(rev)}</b></div><div class="card kpi">Active Products<b>${active.length}</b></div><div class="card kpi">Low Stock<b>${low}</b></div><div class="card kpi">Open Repairs<b>${openRepairs}</b></div></div><div class="card"><h2>System Status</h2><p class="ok"><b>Inventory, sales and repairs synchronized.</b></p><p>Unified sales: <b>${sales.length}</b> · Legacy POS sales: <b>${Array.isArray(legacySales)?legacySales.length:0}</b></p><p>Legacy inventory records: <b>${legacyInv&&typeof legacyInv==='object'?Object.keys(legacyInv).length:0}</b> · Repair tickets: <b>${window.db.repairs.length}</b></p><div class="toolbar"><button class="btn primary" onclick="syncNow()">Sync Now</button><a class="btn ghost" style="text-decoration:none" href="index.html">Open Main POS</a></div></div>`;
}
function syncNow(){MWData.mergeLegacy(window.db);persist();alert('POS data synchronized');renderDashboard()}

function renderInventory(){
  el('main').innerHTML=`<div class="card"><h2>Inventory</h2><p class="muted small">Legacy Main POS values are imported automatically. Editing Cost / Price / Qty here also updates the Main POS inventory on this computer.</p><div class="grid"><input id="pname" class="inp" placeholder="Product name"><input id="pcat" class="inp" placeholder="Category" value="Accessories"><input id="pcost" class="inp" type="number" step="0.01" placeholder="Cost"><input id="pprice" class="inp" type="number" step="0.01" placeholder="Price"><input id="pqty" class="inp" type="number" placeholder="Qty"><input id="pmin" class="inp" type="number" placeholder="Low stock" value="${num(window.db.settings.lowStock)||5}"><input id="pbar" class="inp" placeholder="Barcode / IMEI"><button class="btn primary" onclick="addProduct()">Add Product</button></div><br><div class="toolbar"><input id="psearch" class="inp" placeholder="Search name, category, barcode..." oninput="drawProducts()"><select id="pfilter" class="inp" style="max-width:190px" onchange="drawProducts()"><option value="all">All products</option><option value="active">Active only</option><option value="low">Low stock</option><option value="priced">Priced</option></select><span id="pcount" class="small muted"></span></div><div id="ptable" class="table-wrap"></div></div>`;drawProducts();
}
function productRows(){const q=(el('psearch')?.value||'').toLowerCase(),f=el('pfilter')?.value||'all';return window.db.products.filter(p=>{const hit=!q||[p.name,p.category,p.barcode,p.sku,p.imei].some(v=>String(v||'').toLowerCase().includes(q));if(!hit)return false;if(f==='active')return num(p.price)>0||num(p.qty)>0||num(p.cost)>0;if(f==='low')return (num(p.price)>0||num(p.qty)>0||num(p.cost)>0)&&num(p.qty)<=num(p.minQty??window.db.settings.lowStock);if(f==='priced')return num(p.price)>0;return true})}
function drawProducts(){const rows=productRows();if(el('pcount'))el('pcount').textContent=rows.length+' matches';el('ptable').innerHTML=`<table class="table"><thead><tr><th>Name</th><th>Category</th><th>SKU</th><th>Barcode</th><th>Cost</th><th>Price</th><th>Qty</th><th>Low</th><th>Online</th><th></th></tr></thead><tbody>${rows.slice(0,700).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.sku||'')}</td><td><input value="${esc(p.barcode||'')}" onchange="editProduct('${p.id}','barcode',this.value)"></td><td><input type="number" step="0.01" value="${num(p.cost)}" onchange="editProduct('${p.id}','cost',this.value)"></td><td><input type="number" step="0.01" value="${num(p.price)}" onchange="editProduct('${p.id}','price',this.value)"></td><td><input type="number" value="${num(p.qty)}" onchange="editProduct('${p.id}','qty',this.value)"></td><td><input type="number" value="${num(p.minQty)}" onchange="editProduct('${p.id}','minQty',this.value)"></td><td><input type="checkbox" ${p.showOnline?'checked':''} onchange="editProduct('${p.id}','showOnline',this.checked)"></td><td><button class="btn danger" onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table>${rows.length>700?'<p class="muted">Showing first 700. Refine search to see the rest.</p>':''}`}
function addProduct(){const name=el('pname').value.trim();if(!name){alert('Product name required');return}const id='P'+Date.now();window.db.products.unshift({id,sku:id,name,category:el('pcat').value.trim()||'Accessories',cost:num(el('pcost').value),price:num(el('pprice').value),qty:num(el('pqty').value),minQty:num(el('pmin').value)||num(window.db.settings.lowStock)||5,barcode:el('pbar').value.trim(),imei:'',imeis:[],showOnline:false});persist();renderInventory()}
function editProduct(id,k,v){const p=window.db.products.find(x=>x.id===id);if(!p)return;p[k]=k==='showOnline'?!!v:(['cost','price','qty','minQty'].includes(k)?num(v):v);persist()}
function deleteProduct(id){const p=window.db.products.find(x=>x.id===id);if(!p||!confirm('Delete '+p.name+' from unified inventory?'))return;window.db.products=window.db.products.filter(x=>x.id!==id);persist();drawProducts()}

function renderRepairs(){MWData.applyRepairPaymentsFromLegacySales(window.db);persist();const rows=(window.db.repairs||[]).slice().sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));el('main').innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin:0;flex:1">Repairs</h2><a class="btn primary" style="text-decoration:none" href="repair.html">Open Repair Intake</a></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Customer</th><th>Device</th><th>Status</th><th>Total</th><th>Deposit</th><th>Due</th><th>Updated</th></tr></thead><tbody>${rows.map(r=>{const due=Math.max(0,num(r.total)-num(r.deposit));return `<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.customer)}<br><small>${esc(r.phone||'')}</small></td><td>${esc(r.device)}</td><td><select onchange="setRepairStatus('${r.id}',this.value)">${['Received','In Progress','Waiting for Parts','Ready for Pickup','Completed','Paid'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${money(r.total)}</td><td>${money(r.deposit)}</td><td>${money(due)}</td><td>${fmtDate(r.updatedAt||r.createdAt)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function setRepairStatus(id,status){const r=window.db.repairs.find(x=>x.id===id);if(!r)return;r.status=status;r.updatedAt=new Date().toISOString();if(status==='Paid'||status==='Completed'){r.deposit=num(r.total);r.balance=0;r.paidAt=r.paidAt||new Date().toISOString()}persist();renderRepairs()}

function renderDeals(){el('main').innerHTML=`<div class="card"><h2>Website Deals</h2><div class="warn">These deals are stored in the POS database. The separate public website still requires its own publish workflow.</div><div class="grid"><input id="dname" class="inp" placeholder="Device"><input id="dspec" class="inp" placeholder="Specs"><input id="dprice" class="inp" type="number" step="0.01" placeholder="Price"><input id="dbadge" class="inp" placeholder="Badge"><button class="btn primary" onclick="addDeal()">Add Deal</button><button class="btn ghost" onclick="exportDeals()">Export Deals JSON</button></div><br><div class="table-wrap"><table class="table"><thead><tr><th>Device</th><th>Specs</th><th>Price</th><th>Badge</th><th>Online</th><th></th></tr></thead><tbody>${window.db.websiteDeals.map(d=>`<tr><td>${esc(d.name)}</td><td>${esc(d.spec||'')}</td><td><input type="number" step="0.01" value="${num(d.price)}" onchange="editDeal('${d.id}','price',this.value)"></td><td><input value="${esc(d.badge||'')}" onchange="editDeal('${d.id}','badge',this.value)"></td><td><input type="checkbox" ${d.showOnline!==false?'checked':''} onchange="editDeal('${d.id}','showOnline',this.checked)"></td><td><button class="btn danger" onclick="deleteDeal('${d.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function addDeal(){const name=el('dname').value.trim();if(!name){alert('Device name required');return}window.db.websiteDeals.unshift({id:'D'+Date.now(),name,spec:el('dspec').value.trim(),price:num(el('dprice').value),badge:el('dbadge').value.trim()||'Deal',showOnline:true});persist();renderDeals()}
function editDeal(id,k,v){const d=window.db.websiteDeals.find(x=>x.id===id);if(!d)return;d[k]=k==='showOnline'?!!v:(k==='price'?num(v):v);persist()}
function deleteDeal(id){window.db.websiteDeals=window.db.websiteDeals.filter(d=>d.id!==id);persist();renderDeals()}
function exportDeals(){downloadJSON(window.db.websiteDeals,'mega-wireless-website-deals.json')}

function renderPlans(){el('main').innerHTML=`<div class="card"><h2>Activation Plans</h2><div class="grid"><input id="carrier" class="inp" placeholder="Carrier"><input id="plan" class="inp" placeholder="Plan"><input id="planprice" class="inp" type="number" step="0.01" placeholder="Price"><input id="features" class="inp" placeholder="Features"><button class="btn primary" onclick="addPlan()">Add Plan</button></div><br><div class="table-wrap"><table class="table"><thead><tr><th>Carrier</th><th>Plan</th><th>Price</th><th>Features</th><th></th></tr></thead><tbody>${window.db.plans.map((p,i)=>`<tr><td>${esc(p.carrier)}</td><td>${esc(p.plan)}</td><td>${money(p.price)}</td><td>${esc(p.features||'')}</td><td><button class="btn danger" onclick="deletePlan(${i})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function addPlan(){const carrier=el('carrier').value.trim(),plan=el('plan').value.trim();if(!carrier||!plan){alert('Carrier and plan required');return}window.db.plans.unshift({carrier,plan,price:num(el('planprice').value),features:el('features').value.trim()});persist();renderPlans()}
function deletePlan(i){window.db.plans.splice(i,1);persist();renderPlans()}

function renderReports(){const sales=(window.db.sales||[]).filter(s=>!s.voided),rev=sales.reduce((a,s)=>a+num(s.total),0),cost=sales.reduce((a,s)=>a+num(s.cost),0),invCost=window.db.products.reduce((a,p)=>a+num(p.cost)*num(p.qty),0),retail=window.db.products.reduce((a,p)=>a+num(p.price)*num(p.qty),0);el('main').innerHTML=`<div class="kpis"><div class="card kpi">Total Sales<b>${money(rev)}</b></div><div class="card kpi">Gross Profit<b>${money(rev-cost)}</b></div><div class="card kpi">Inventory Cost<b>${money(invCost)}</b></div><div class="card kpi">Inventory Retail<b>${money(retail)}</b></div></div><div class="card"><h2>Transactions</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Invoice</th><th>Payment</th><th>Total</th><th>Cost</th><th>Profit</th></tr></thead><tbody>${sales.slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,300).map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${esc(s.invoice||s.id||'')}</td><td>${esc(s.payment||'')}</td><td>${money(s.total)}</td><td>${money(s.cost)}</td><td>${money(num(s.total)-num(s.cost))}</td></tr>`).join('')}</tbody></table></div></div>`}

function renderSettings(){const s=window.db.settings||{};el('main').innerHTML=`<div class="card"><h2>Store Settings</h2><div class="grid2"><div><label>Store Name</label><input id="setName" class="inp" value="${esc(s.storeName||'')}"></div><div><label>Phone</label><input id="setPhone" class="inp" value="${esc(s.phone||'')}"></div><div><label>Email</label><input id="setEmail" class="inp" value="${esc(s.email||'')}"></div><div><label>Address</label><input id="setAddress" class="inp" value="${esc(s.address||'')}"></div><div><label>Sales Tax %</label><input id="setTax" class="inp" type="number" step="0.01" value="${num(s.taxRate)||9.75}"></div><div><label>Default Low Stock</label><input id="setLow" class="inp" type="number" value="${num(s.lowStock)||5}"></div></div><br><button class="btn primary" onclick="saveSettings()">Save Settings</button></div>`}
function saveSettings(){const s=window.db.settings;s.storeName=el('setName').value.trim();s.phone=el('setPhone').value.trim();s.email=el('setEmail').value.trim();s.address=el('setAddress').value.trim();s.taxRate=num(el('setTax').value)||9.75;s.lowStock=num(el('setLow').value)||5;persist();alert('Settings saved and tax synchronized with Main POS')}

function renderBackup(){el('main').innerHTML=`<div class="card stack"><h2>Backup / Restore</h2><div class="warn"><b>Important:</b> this POS is browser-local. Use backups before changing computers or clearing browser data.</div><div class="toolbar"><button class="btn primary" onclick="downloadBackup()">Download Full Backup</button><button class="btn ghost" onclick="copyBackup()">Copy Backup JSON</button><button class="btn gold" onclick="syncNow()">Sync Legacy POS Now</button></div><textarea id="restore" class="inp" style="height:240px" placeholder="Paste a Mega Wireless backup JSON here"></textarea><div class="toolbar"><button class="btn primary" onclick="restoreBackup()">Restore Backup</button><button class="btn danger" onclick="reloadSeed()">Reset Platform Data</button></div></div>`}
function backupBundle(){return {version:3,exported:new Date().toISOString(),platform:window.db,legacy:{inv:MWData.readJSON('mw_inv',{}),sales:MWData.readJSON('mw_sales',[]),repairs:MWData.readJSON('mw_repairs',[]),cust:MWData.readJSON('mw_cust',{}),cfg:MWData.readJSON('mw_cfg',{})}}}
function downloadJSON(data,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadBackup(){downloadJSON(backupBundle(),'mega-wireless-full-backup-'+new Date().toISOString().slice(0,10)+'.json')}
async function copyBackup(){try{await navigator.clipboard.writeText(JSON.stringify(backupBundle(),null,2));alert('Backup copied')}catch(e){alert('Clipboard blocked. Use Download Full Backup instead.')}}
async function restoreBackup(){try{const raw=JSON.parse(el('restore').value);if(raw.legacy){if(raw.legacy.inv)MWData.writeJSON('mw_inv',raw.legacy.inv);if(raw.legacy.sales)MWData.writeJSON('mw_sales',raw.legacy.sales);if(raw.legacy.repairs)MWData.writeJSON('mw_repairs',raw.legacy.repairs);if(raw.legacy.cust)MWData.writeJSON('mw_cust',raw.legacy.cust);if(raw.legacy.cfg)MWData.writeJSON('mw_cfg',raw.legacy.cfg)}if(raw.platform&&Array.isArray(raw.platform.products))window.db=MWData.normalize(raw.platform);else if(Array.isArray(raw.products))window.db=MWData.normalize(raw);else if(raw.inv&&raw.sales){MWData.writeJSON('mw_inv',raw.inv);MWData.writeJSON('mw_sales',raw.sales);if(raw.custom)MWData.writeJSON('mw_cust',raw.custom);if(raw.cfg)MWData.writeJSON('mw_cfg',raw.cfg);localStorage.removeItem(MWData.DBKEY);window.db=await loadSeed()}else throw new Error('Unsupported backup format');MWData.mergeLegacy(window.db);persist();alert('Backup restored and synchronized');route('dashboard')}catch(e){alert('Restore failed: '+e.message)}}
async function reloadSeed(){if(!confirm('Reset platform data from seed? Legacy Main POS data will be re-imported automatically. Download a backup first.'))return;localStorage.removeItem(MWData.DBKEY);window.db=await loadSeed();route('dashboard')}

if(sessionStorage.getItem('mw_identity_token'))startAdmin();
</script>
</body>
