<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mega Wireless Admin Test</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#07172d;color:#fff;min-height:100vh;display:grid;place-items:center}
.box{width:min(420px,88vw);background:#fff;color:#07172d;padding:32px;border-radius:20px;text-align:center}
button{padding:14px 18px;border:0;border-radius:10px;background:#087dff;color:#fff;font-weight:700;cursor:pointer}
#status{margin-top:16px;font-size:14px;color:#555}
</style>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
<div class="box">
<h1>Mega Wireless Admin</h1>
<p>If you can see this page, the admin route is working.</p>
<button onclick="login()">Login with Netlify Identity</button>
<div id="status">Waiting for login.</div>
</div>
<script>
function login(){
  if(!window.netlifyIdentity){document.getElementById('status').textContent='Netlify Identity failed to load';return;}
  netlifyIdentity.open('login');
}
if(window.netlifyIdentity){
  netlifyIdentity.on('init',function(user){document.getElementById('status').textContent=user?'Logged in: '+user.email:'Not logged in';});
  netlifyIdentity.on('login',function(user){netlifyIdentity.close();document.getElementById('status').textContent='Logged in: '+user.email;});
}
</script>
</body>
</html>
