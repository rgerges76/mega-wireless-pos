<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mega Wireless Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/app.css"><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script></head><body class="admin-body" onload="initAdmin()"><div id="login" class="hidden" style="min-height:100vh;display:grid;place-items:center"><div class="white" style="width:360px;max-width:calc(100vw - 32px)"><h2>Admin Login</h2><p class="muted">Use the same email and password from your Netlify invitation.</p><input id="adminEmail" class="inp" type="email" placeholder="Email" autocomplete="email"><br><br><input id="adminPass" class="inp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()"><br><br><button class="btn blue" onclick="adminLogin()">Login</button><p id="loginErr" style="color:red"></p></div></div><div id="admin" class="hidden"><div class="appbar"><b>MEGA WIRELESS ADMIN</b><div style="display:flex;gap:8px"><a class="pillbtn" href="../index.html">View Website</a><button class="pillbtn" onclick="adminLogout()">Logout</button></div></div><div class="shell"><aside class="side"><button data-tab="dashboard" onclick="routeAdmin('dashboard')">Dashboard</button><button data-tab="products" onclick="routeAdmin('products')">Inventory</button><button data-tab="deals" onclick="routeAdmin('deals')">Website Deals</button><button data-tab="plans" onclick="routeAdmin('plans')">Activation Plans</button><button data-tab="reports" onclick="routeAdmin('reports')">Reports</button><button data-tab="export" onclick="routeAdmin('export')">Backup / Restore</button></aside><main class="main" id="main"></main></div></div><script src="../assets/js/app.js"></script><script>
function waitForIdentity(){return new Promise(resolve=>{if(!window.netlifyIdentity)return resolve();if(netlifyIdentity.currentUser())return resolve();let finished=false;const done=()=>{if(finished)return;finished=true;resolve()};netlifyIdentity.on('init',done);setTimeout(done,1500)})}
adminLogin=async function(){const err=document.getElementById('loginErr');err.textContent='';const email=document.getElementById('adminEmail').value.trim();const pass=document.getElementById('adminPass').value;if(!email||!pass){err.textContent='Enter email and password';return}if(!window.netlifyIdentity){err.textContent='Netlify Identity is not available';return}try{await netlifyIdentity.login(email,pass,true);sessionStorage.setItem('mw_admin','1');location.hash='dashboard';await initAdmin()}catch(e){console.error(e);err.textContent=e&&e.message?e.message:'Login failed'}};
initAdmin=async function(){await waitForIdentity();const user=window.netlifyIdentity&&netlifyIdentity.currentUser();if(!user){sessionStorage.removeItem('mw_admin');document.getElementById('login').classList.remove('hidden');document.getElementById('admin').classList.add('hidden');return}sessionStorage.setItem('mw_admin','1');document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');window.db=await loadSeed();routeAdmin(location.hash?location.hash.slice(1):'dashboard')};
adminLogout=async function(){try{if(window.netlifyIdentity)await netlifyIdentity.logout()}finally{sessionStorage.removeItem('mw_admin');location.hash='';await initAdmin()}};
if(window.netlifyIdentity){netlifyIdentity.on('login',()=>{sessionStorage.setItem('mw_admin','1')});netlifyIdentity.on('logout',()=>{sessionStorage.removeItem('mw_admin')})}
if(location.hash){const tab=location.hash.slice(1);setTimeout(()=>{if(window.netlifyIdentity&&netlifyIdentity.currentUser()&&tab)routeAdmin(tab)},100)}
</script></body></html>
